<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#08111f;font-family:Arial,sans-serif;color:#eaf6ff">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#08111f">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#0d1b2e;border:1px solid #183653;border-radius:18px;padding:28px">
          <tr><td>
            <div style="font-size:24px;font-weight:700;color:#57d7ff">PepDay</div>
            <h1 style="font-size:22px;margin:24px 0 10px">Confirme seu e-mail</h1>
            <p style="font-size:16px;line-height:1.6;color:#b8ccdd">Digite este código no PepDay para confirmar seu e-mail:</p>
            <div style="font-size:34px;font-weight:700;letter-spacing:8px;text-align:center;padding:20px;margin:22px 0;background:#071421;border-radius:14px;color:#ffffff">{{ .Token }}</div>
            <p style="font-size:14px;line-height:1.6;color:#8fa8bb">O código é de uso único. Se você não solicitou este acesso, ignore esta mensagem.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
