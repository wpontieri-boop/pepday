
[auth.email.template.confirmation]
subject = "Seu código de confirmação PepDay: {{ .Token }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Seu código de acesso PepDay: {{ .Token }}"
content_path = "./supabase/templates/magic_link.html"

[functions.mercado-pago-webhook]
enabled = true
verify_jwt = false
# Webhook externo: autenticação é a assinatura HMAC do Mercado Pago.
entrypoint = "./functions/mercado-pago-webhook/index.mjs"

[functions.mercado-pago-checkout]
enabled = true
verify_jwt = false
# A função valida o JWT do usuário diretamente no Supabase Auth.
entrypoint = "./functions/mercado-pago-checkout/index.mjs"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/mercado-pago-webhook/*.html" ]

[functions.brevo-email-worker]
enabled = true
verify_jwt = false
# Worker interno: autenticação por segredo próprio da função.
entrypoint = "./functions/brevo-email-worker/index.mjs"

[functions.fcm-push-worker]
enabled = true
verify_jwt = false
# Worker interno: autenticação por segredo próprio da função.
entrypoint = "./functions/fcm-push-worker/index.mjs"

[functions.fcm-push-cron-dispatcher]
enabled = true
verify_jwt = false
# Dispatcher interno: token efêmero do Postgres + segredo do worker somente no backend.
entrypoint = "./functions/fcm-push-cron-dispatcher/index.mjs"

[functions.account-delete]
enabled = true
verify_jwt = false
# A função valida o JWT do usuário diretamente no Supabase Auth e cancela billing antes da exclusão.
entrypoint = "./functions/account-delete/index.mjs"

[functions.mercado-pago-cancel-subscription]
enabled = true
verify_jwt = false
# A função valida o JWT do usuário diretamente no Supabase Auth antes de cancelar a assinatura no Mercado Pago.
entrypoint = "./functions/mercado-pago-cancel-subscription/index.mjs"
[functions.admin-team-invite]
enabled = true
verify_jwt = false
# OWNER autenticado em AAL2; a função valida a sessão e cria apenas membros administrativos TEST.
entrypoint = "./functions/admin-team-invite/index.mjs"

[functions.recovery-worker]
enabled = true
verify_jwt = false
# TEST exclusivamente; token curto de uso único emitido pelo Postgres.
entrypoint = "./functions/recovery-worker/index.mjs"

[functions.recovery-checkout]
enabled = true
verify_jwt = false
# TEST exclusivamente; sessão validada diretamente no Auth e elegibilidade no SQL.
entrypoint = "./functions/recovery-checkout/index.mjs"

[functions.partner-finance-worker]
enabled = true
verify_jwt = false
# TEST exato + sandbox; token PostgreSQL curto, hash e uso único. Sem cobrança/transferência.
entrypoint = "./functions/partner-finance-worker/index.mjs"
