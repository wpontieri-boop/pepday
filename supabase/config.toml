
[functions.mercado-pago-webhook]
enabled = true
verify_jwt = false
# Webhook externo: autenticação é a assinatura HMAC do Mercado Pago.
entrypoint = "./functions/mercado-pago-webhook/index.mjs"

[functions.mercado-pago-checkout]
enabled = true
verify_jwt = false
# A função valida o JWT do usuário diretamente no Supabase Auth.
entrypoint = "./functions/mercado-pago-checkout/index.mjs"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/mercado-pago-webhook/*.html" ]

[functions.brevo-email-worker]
enabled = true
verify_jwt = false
# Worker interno: autenticação por segredo próprio da função.
entrypoint = "./functions/brevo-email-worker/index.mjs"

[functions.fcm-push-worker]
enabled = true
verify_jwt = false
# Worker interno: autenticação por segredo próprio da função.
entrypoint = "./functions/fcm-push-worker/index.mjs"

[functions.fcm-push-cron-dispatcher]
enabled = true
verify_jwt = false
# Dispatcher interno: token efêmero do Postgres + segredo do worker somente no backend.
entrypoint = "./functions/fcm-push-cron-dispatcher/index.mjs"

[functions.account-delete]
enabled = true
verify_jwt = false
# A função valida o JWT do usuário diretamente no Supabase Auth e cancela billing antes da exclusão.
entrypoint = "./functions/account-delete/index.mjs"
